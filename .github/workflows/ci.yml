name: FastAPI CI/CD Pipeline

# 觸發條件：當有人 Push 到 master/main 分支，或是開 Pull Request 時觸發
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]


jobs:
  test:
    name: Run Linting and Pytest
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false # 🟢 關鍵：任一版本失敗時，其他版本仍會繼續跑完，便於觀察整體相容性
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      # Step 1: 拉取你的 GitHub 專案程式碼
      - name: Check out repository
        uses: actions/checkout@v4
      
      # # Step 2: 安裝 Python 3.13 環境
      # - name: Set up Python 3.13
      #   uses: actions/setup-python@v5
      #   with:
      #     python-version: "3.13"
      #     cache: "pip" # 自動快取 pip 套件，加速後續跑 CI 的時間
      
      - name: ⚙️ 設定 Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"


      # Step 3: 安裝依賴套件與開發工具 (Ruff)
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
  
      # Step 5: 執行 Ruff 程式碼品質與格式檢查
      - name: Run Ruff Linter
        run: |
          ruff check .
          ruff format --check .
      # Step 6: 執行 Pytest 自動化測試
      - name: Run Pytest
        env:
          SECRET_KEY: ci_test_secret_key_1234567890
        run: |
          pytest -v